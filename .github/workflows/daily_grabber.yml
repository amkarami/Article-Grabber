name: Daily Majles Article Grabber

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *' # هر روز ساعت ۷:۳۰ صبح به وقت تهران

jobs:
  run-grabber:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run grabber script
        run: python grabber.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloaded_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update articles json" && git push)
