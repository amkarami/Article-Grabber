<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال خودکار مقالات نشریه مجلس</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #059669;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }
        header p {
            color: #93c5fd;
            font-size: 0.95rem;
        }
        .container {
            max-width: 950px;
            margin: -1.5rem auto 2rem;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }
        .toolbar {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .toolbar input {
            flex: 1;
            min-width: 200px;
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .toolbar input:focus {
            border-color: var(--primary-light);
        }
        .badge {
            background: #eff6ff;
            color: var(--primary);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .btn-drive-folder {
            background: var(--success);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .articles-list {
            display: grid;
            gap: 1rem;
        }
        .article-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .article-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .article-num {
            background: #f8fafc;
            border: 1px solid var(--border);
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .article-title {
            font-size: 1.05rem;
            font-weight: 700;
            direction: ltr;
            text-align: right;
            color: #1e293b;
        }
        .article-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-doi {
            background-color: #f59e0b;
            color: white;
        }
        .btn-doi:hover {
            background-color: #d97706;
        }
        .btn-majles {
            background-color: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
        }
        .btn-majles:hover {
            background-color: #dbeafe;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-sub);
            background: white;
            border-radius: 12px;
            border: 1px dashed var(--border);
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>پورتال خودکار مقالات نشریه مجلس</h1>
        <p>آرشیو مقالات دانلودشده nashr.majles.ir در فضای ذخیره‌سازی ابری</p>
    </header>

    <div class="container">
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="جستجوی شناسه یا عنوان..." oninput="filterArticles()">
            <div class="badge" id="statsCount">تعداد مقالات: ۰</div>
            <a href="https://drive.google.com/drive/search?q=%D9%85%D8%AC%D9%84%D8%B3%20%D8%B1%D8%A7%D9%87%D8%A8%D8%B1%D8%AF" target="_blank" class="btn-drive-folder">
                📁 مشاهده کل فایل‌ها در Google Drive
            </a>
        </div>

        <div id="articlesContainer" class="articles-list">
            <div class="empty-state">در حال بارگذاری مقالات...</div>
        </div>
    </div>

    <footer>
        همگام‌سازی خودکار با GitHub Actions و ذخیره در Google Drive
    </footer>

    <script>
        let allArticles = [];

        async function loadArticles() {
            try {
                const response = await fetch('downloaded_articles.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('فایل یافت نشد');
                const data = await response.json();
                allArticles = Array.isArray(data) ? data : (data.articles || []);
                renderArticles(allArticles);
            } catch (err) {
                console.error(err);
                document.getElementById('articlesContainer').innerHTML = `
                    <div class="empty-state">فایلی برای نمایش پیدا نشد.</div>`;
            }
        }

        function renderArticles(list) {
            const container = document.getElementById('articlesContainer');
            const stats = document.getElementById('statsCount');
            stats.innerText = `تعداد مقالات: ${list.length}`;

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="empty-state">موردی یافت نشد.</div>`;
                return;
            }

            container.innerHTML = list.map((item, index) => {
                const raw = typeof item === 'string' ? item : (item.id || item.title || '');
                
                // ایجاد لینک DOI مستقیم
                let doiUrl = raw;
                if (!raw.startsWith('http')) {
                    doiUrl = 'https://doi.org/' + raw;
                }

                // جستجوی مستقیم فایل این مقاله در درایو
                const driveSearchUrl = `https://drive.google.com/drive/search?q=${encodeURIComponent(raw)}`;

                return `
                    <div class="article-card">
                        <div class="article-info">
                            <span class="article-num">${index + 1}</span>
                            <div class="article-title">${raw}</div>
                        </div>
                        <div class="article-actions">
                            <a href="${doiUrl}" target="_blank" class="btn btn-doi">
                                🔗 باز کردن پیوند DOI
                            </a>
                            <a href="${driveSearchUrl}" target="_blank" class="btn btn-majles">
                                📥 دانلود از درایو
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterArticles() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = allArticles.filter(item => {
                const str = typeof item === 'string' ? item : JSON.stringify(item);
                return str.toLowerCase().includes(query);
            });
            renderArticles(filtered);
        }

        loadArticles();
    </script>
</body>
</html>
